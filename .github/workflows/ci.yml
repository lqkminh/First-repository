name: CI
on:
  push:
    branches: ["feature/thanh-le-missa-next-platform"]
  pull_request:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://missa:missa_test_password@localhost:5432/thanh_le_missa?schema=public
      NEXTAUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
