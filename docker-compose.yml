services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: missa
      POSTGRES_PASSWORD: missa_dev_password
      POSTGRES_DB: thanh_le_missa
    ports:
      - "5432:5432"
    volumes:
      - missa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missa -d thanh_le_missa"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma db push && npm run dev"
    environment:
      DATABASE_URL: postgresql://missa:missa_dev_password@db:5432/thanh_le_missa?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-development-only-change-this-secret
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - missa_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  missa_postgres:
  missa_node_modules:
